services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
  web:
    build: ./frontend
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"
volumes:
  postgres_data:
