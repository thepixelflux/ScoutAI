services:
  - type: web
    name: scoutai-demo
    runtime: docker
    plan: free
    branch: work
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scoutai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false

databases:
  - name: scoutai-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
